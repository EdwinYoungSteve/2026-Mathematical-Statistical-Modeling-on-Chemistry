<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081422" />
    <title>MolSight · 分子活性预测平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div><strong>MolSight</strong><small>CHEMISTRY ML STUDIO</small></div>
        </div>

        <div class="workspace-switcher">
          <span class="eyebrow">当前工作区</span>
          <button class="workspace-button" type="button"><span class="workspace-dot"></span> EGFR 抗癌活性项目 <span class="chevron">⌄</span></button>
        </div>

        <nav class="nav-list">
          <span class="nav-section">工作台</span>
          <button class="nav-item active" data-page="overview"><span class="nav-icon">⌂</span> 项目总览</button>
          <button class="nav-item" data-page="single"><span class="nav-icon">✦</span> 单分子预测</button>
          <button class="nav-item" data-page="batch"><span class="nav-icon">▦</span> 批量虚拟筛选</button>
          <span class="nav-section">分析</span>
          <button class="nav-item" data-page="evaluation"><span class="nav-icon">◒</span> 模型评估</button>
          <button class="nav-item" data-page="reports"><span class="nav-icon">▤</span> 实验报告</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="system-status"><span class="status-dot"></span><span><b>演示模式</b><small>连接真实 API 后自动切换</small></span></div>
          <div class="user-card"><div class="avatar">MS</div><div><b>Modeling Lab</b><small>研究员账户</small></div><span class="more">···</span></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>EGFR 项目</span><i>/</i><b id="breadcrumbCurrent">项目总览</b></div>
          <div class="topbar-actions"><button class="icon-button" title="搜索" type="button">⌕</button><button class="icon-button" title="通知" type="button">♢<em></em></button><div class="topbar-divider"></div><span class="last-sync">最近同步 <b>今天 14:32</b></span></div>
        </header>

        <div id="page-overview" class="page active-page"></div>
        <div id="page-single" class="page"></div>
        <div id="page-batch" class="page"></div>
        <div id="page-evaluation" class="page"></div>
        <div id="page-reports" class="page"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
